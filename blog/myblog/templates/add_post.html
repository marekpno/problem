{% extends 'base.html' %}

{% block title %}Create a New Blog Post{% endblock %}

{% block content %}

{% if user.is_authenticated %}
    <h1>Add a New Blog Post</h1>
    <br><br/>
    <div class="form-group">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}  <!-- Formularz wyświetlający wszystkie pola -->
            <button type="submit" class="btn btn-secondary">POST</button>
        </form>  <!-- Poprawne zamknięcie tagu form -->
    </div>
{% else %}
    <p>You must be logged in to add a blog post. <a href="{% url 'login' %}">Log in</a></p>  <!-- Link do logowania -->
{% endif %}

{% endblock %}
